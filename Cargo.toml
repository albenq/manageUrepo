[package]
name = "git-pm"
version = "0.9.0"
edition = "2021"

[dependencies]
eframe = "0.28"
egui_extras = "0.28"
rusqlite = { version = "0.32", features = ["bundled"] }
argon2 = "0.5"
aes-gcm = "0.10"
rand = "0.8"
rfd = "0.15"

[build-dependencies]
winresource = "0.1"

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Globalization", "Win32_UI_WindowsAndMessaging", "Win32_Foundation"] }
